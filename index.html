<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASHEN TOWN | SURVIVAL HORROR</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        :root {
            --primary-red: #bc0000;
            --dark-red: #5e0000;
            --glow: 0 0 15px rgba(188, 0, 0, 0.7);
            /* Font Arial cho tiếng Việt để tránh lỗi hiển thị */
            --vn-font: Arial, "Helvetica Neue", Helvetica, sans-serif;
        }

        *{margin:0;padding:0;box-sizing:border-box;}
        html{scroll-behavior:smooth;}

        body {
            font-family: 'Rajdhani', sans-serif;
            background: #000;
            color: #e0e0e0;
            overflow-x: hidden;
            text-transform: uppercase;
        }

        /* Khi đổi sang tiếng Việt, áp dụng Arial cho các đoạn văn bản nội dung */
        html[lang="vi"] body {
            font-family: var(--vn-font);
        }

        /* Giữ nguyên font tiêu đề dù ở ngôn ngữ nào */
        h1, .chalk-logo, .sub-logo, .inv-item, .lang-label {
            font-family: 'Orbitron', sans-serif !important;
        }

        /* HIỆU ỨNG CRT */
        body::before {
            content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 11000; background-size: 100% 3px, 3px 100%; pointer-events: none;
        }

        /* HÌNH NỀN */
        .static-bg {
            position: fixed; top: -5%; left: -5%; width: 110%; height: 110%;
            background: url('mikaindie.jpg') no-repeat center center; background-size: cover;
            z-index: -2; filter: brightness(0.7) contrast(1.1); animation: breathing 20s ease-in-out infinite;
        }

        @keyframes breathing { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .overlay { position: fixed; inset: 0; background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.4) 110%, rgba(0,0,0,0.9) 140%); z-index: -1; }

        /* MENU PHẢI */
        header { position: fixed; top: 50px; right: 40px; z-index: 2000; }
        .inventory-menu { display: flex; flex-direction: column; align-items: flex-end; gap: 20px; }
        .inv-item {
            color: #fff; text-decoration: none; font-size: 14px; font-weight: 700; 
            letter-spacing: 3px; transition: 0.4s; display: flex; align-items: center; gap: 12px;
        }
        .nav-dot { width: 6px; height: 6px; background-color: var(--primary-red); border-radius: 50%; box-shadow: var(--glow); }
        .inv-item:hover { color: var(--primary-red); transform: translateX(-10px); }

        /* LANGUAGE SELECTOR */
        .lang-container {
            margin-top: 30px; text-align: right; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px;
        }
        .lang-label { font-size: 12px; color: #666; letter-spacing: 2px; margin-bottom: 5px; display: block; }
        .lang-switch { display: flex; justify-content: flex-end; gap: 10px; }
        .lang-btn {
            background: none; border: none; color: #555; cursor: pointer;
            font-size: 14px; font-weight: bold; transition: 0.3s; font-family: 'Orbitron';
        }
        .lang-btn.active { color: var(--primary-red); text-shadow: var(--glow); }
        .lang-btn:hover { color: #fff; }

        /* HERO CONTENT */
        .hero-content { position: fixed; top: 50%; left: 8%; transform: translateY(-50%); z-index: 10; }
        .chalk-logo { font-family: 'Special Elite' !important; font-size: clamp(60px, 10vw, 120px); color: #fff; line-height: 0.8; }
        .sub-logo { font-family: 'Special Elite' !important; font-size: 25px; letter-spacing: 10px; border: 1px solid #444; padding: 5px 20px; background: rgba(0,0,0,0.6); display: inline-block; margin-top: 10px;}

        /* SECTIONS */
        section { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 100px 10%; position: relative; }
        section:not(#top) { background: rgba(5, 5, 5, 0.95); z-index: 100; }
        h1 { border-bottom: 2px solid var(--primary-red); padding-bottom: 10px; margin-bottom: 30px; font-size: 40px; }
        
        /* POPUP */
        .popup { position: fixed; inset: 0; background: rgba(0,0,0,0.98); display: none; z-index: 10000; padding: 50px; }
        .popup-box { display: flex; width: 100%; height: 100%; border: 1px solid var(--dark-red); background: #000; }
        .popup-right { width: 55%; padding: 40px; display: flex; flex-direction: column; overflow-y: auto; }
        .stat-item { font-family: 'Orbitron'; font-size: 11px; margin-bottom: 10px; color: #666; }
        .stat-item span { display: block; color: #fff; font-size: 15px; font-family: var(--vn-font); }

        .btn-disabled {
            display: inline-block; margin-top: 15px; padding: 10px 25px;
            background: rgba(255, 255, 255, 0.05); color: rgba(255, 255, 255, 0.2);
            border: 1px dashed rgba(255, 255, 255, 0.2); text-decoration: none; cursor: not-allowed;
        }

        @media (max-width: 992px) { .popup-box { flex-direction: column; } .popup-right { width: 100%; } }
    </style>
</head>
<body>

<div class="static-bg" id="bgImg"></div>
<div class="overlay"></div>

<header>
    <nav class="inventory-menu">
        <a href="#top" class="inv-item" id="nav-top">TOP <span class="nav-dot"></span></a>
        <a href="#about" class="inv-item" id="nav-about">ABOUT <span class="nav-dot"></span></a>
        <a href="#story" class="inv-item" id="nav-story">STORY <span class="nav-dot"></span></a>
        <a href="#characters" class="inv-item" id="nav-chars">CHARACTERS <span class="nav-dot"></span></a>
        <a href="#trailers" class="inv-item" id="nav-trailers">TRAILERS <span class="nav-dot"></span></a>
        
        <div class="lang-container">
            <span class="lang-label">LANGUAGE :</span>
            <div class="lang-switch">
                <button class="lang-btn active" id="btn-en" onclick="setLanguage('en')">EN</button>
                <span style="color:#333">/</span>
                <button class="lang-btn" id="btn-vi" onclick="setLanguage('vi')">VN</button>
            </div>
        </div>
    </nav>
</header>

<div class="hero-content">
    <div class="chalk-logo">ASHEN TOWN</div><br>
    <div id="sub-logo" class="sub-logo">PURGATORY</div>
    
    <div class="release-info" style="margin-top:20px;">
        <span id="protocol-label" style="opacity: 0.5; font-size: 12px; letter-spacing: 2px;">PROTOCOL: EARLY_ACCESS</span><br>
        <span id="deployment-label" style="color: var(--primary-red); font-size: 20px;">DEPLOYMENT: ??/??/2030</span><br>
        <a href="javascript:void(0)" class="btn-disabled"><i class="fa-solid fa-download"></i> <span id="btn-dl-text">DOWNLOAD NOW</span></a>
    </div>
</div>

<section id="top"></section>

<section id="about">
    <h1 id="h-about">ABOUT</h1>
    <div id="content-about" style="max-width: 800px; line-height: 1.8;"></div>
</section>

<section id="story">
    <h1 id="h-story">STORY</h1>
    <div id="content-story" style="max-width: 800px; line-height: 1.8;"></div>
</section>

<section id="characters">
    <h1 id="h-chars">CHARACTERS</h1>
    <div class="char-row" id="char-list" style="display: flex; gap: 20px; flex-wrap: wrap;"></div>
</section>

<div id="popup" class="popup">
    <div class="popup-box">
        <div class="popup-right" style="width: 100%;">
            <span onclick="closePopup()" style="text-align: right; cursor: pointer; color: var(--primary-red); font-size: 30px;">× CLOSE</span>
            <h2 id="p-name" style="font-family: 'Orbitron'; font-size: 40px; color: var(--primary-red);"></h2>
            <div id="p-desc" style="margin: 20px 0; font-size: 16px; border-left: 2px solid #333; padding-left: 20px;"></div>
            <div class="stats-grid" id="p-stats" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;"></div>
        </div>
    </div>
</div>

<script>
    const langData = {
        en: {
            nav: { top: "TOP", about: "ABOUT", story: "STORY", chars: "CHARACTERS" },
            hero: { sub: "PURGATORY", protocol: "PROTOCOL: EARLY_ACCESS", deploy: "DEPLOYMENT: ??/??/2030", dl: "DOWNLOAD NOW" },
            about: `<p><strong>Enter Ashen Town: Purgatory</strong><br>Where ancient myths collide with visceral survival horror.</p>`,
            story: `<p><strong>A Silence That Screams</strong><br>A series of chilling disappearances has plagued the remote town of Kisaragi, Japan. The truth only begins to surface when a veteran officer visits the town...</p>`,
            chars: [
                { name: 'REIKA', desc: 'Special agent in bio-terrorism. She enters Kisaragi with a classified objective.', stats: 'Rank: Agent | Blood: AB- | Height: 170cm' },
                { name: 'UNKNOWN', desc: 'Data encrypted. S-Rank threat.', stats: 'Rank: ??? | Blood: ??? | Height: ???' }
            ]
        },
        vi: {
            nav: { top: "ĐẦU TRANG", about: "GIỚI THIỆU", story: "CỐT TRUYỆN", chars: "NHÂN VẬT" },
            hero: { sub: "LUÂN HỒI", protocol: "GIAO THỨC: TRUY CẬP SỚM", deploy: "TRIỂN KHAI: ??/??/2030", dl: "TẢI XUỐNG NGAY" },
            about: `<p><strong>Bước vào Ashen Town: Purgatory</strong><br>Nơi những huyền thoại cổ xưa đối đầu với nỗi kinh hoàng sinh tồn rợn tóc gáy.</p>`,
            story: `<p><strong>Sự im lặng chết chóc</strong><br>Hàng loạt vụ mất tích bí ẩn xảy ra tại thị trấn Kisaragi hẻo lánh. Sự thật bắt đầu hé lộ khi một viên cảnh sát kỳ cựu đặt chân đến đây...</p>`,
            chars: [
                { name: 'REIKA', desc: 'Đặc vụ cao cấp chống khủng bố sinh học. Cô đến Kisaragi với mục tiêu cá nhân tuyệt mật.', stats: 'Cấp bậc: Đặc vụ | Nhóm máu: AB- | Chiều cao: 170cm' },
                { name: 'KHÔNG XÁC ĐỊNH', desc: 'Dữ liệu bị mã hóa. Mối đe dọa cấp S.', stats: 'Cấp bậc: ??? | Nhóm máu: ??? | Chiều cao: ???' }
            ]
        }
    };

    function setLanguage(lang) {
        document.documentElement.lang = lang;
        const d = langData[lang];

        // Nav
        document.getElementById('nav-top').innerHTML = `${d.nav.top} <span class="nav-dot"></span>`;
        document.getElementById('nav-about').innerHTML = `${d.nav.about} <span class="nav-dot"></span>`;
        document.getElementById('nav-story').innerHTML = `${d.nav.story} <span class="nav-dot"></span>`;
        document.getElementById('nav-chars').innerHTML = `${d.nav.chars} <span class="nav-dot"></span>`;

        // Hero
        document.getElementById('sub-logo').innerText = d.hero.sub;
        document.getElementById('protocol-label').innerText = d.hero.protocol;
        document.getElementById('deployment-label').innerText = d.hero.deploy;
        document.getElementById('btn-dl-text').innerText = d.hero.dl;

        // Content
        document.getElementById('content-about').innerHTML = d.about;
        document.getElementById('content-story').innerHTML = d.story;
        
        // Chars List
        const list = document.getElementById('char-list');
        list.innerHTML = '';
        d.chars.forEach((c, i) => {
            list.innerHTML += `<div onclick="openChar(${i})" style="border: 1px solid #333; padding: 20px; cursor: pointer;">${c.name}</div>`;
        });

        document.getElementById('btn-en').classList.toggle('active', lang === 'en');
        document.getElementById('btn-vi').classList.toggle('active', lang === 'vi');
    }

    function openChar(i) {
        const char = langData[document.documentElement.lang].chars[i];
        document.getElementById('popup').style.display = 'block';
        document.getElementById('p-name').innerText = char.name;
        document.getElementById('p-desc').innerText = char.desc;
        
        const statsGrid = document.getElementById('p-stats');
        statsGrid.innerHTML = '';
        char.stats.split('|').forEach(s => {
            const [l, v] = s.split(':');
            statsGrid.innerHTML += `<div class="stat-item">${l}<span>${v}</span></div>`;
        });
    }

    function closePopup() { document.getElementById('popup').style.display = 'none'; }
    window.onload = () => setLanguage('en');
</script>

</body>
</html>
