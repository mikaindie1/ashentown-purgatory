<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASHEN TOWN | SURVIVAL HORROR</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        :root {
            --primary-red: #bc0000;
            --dark-red: #5e0000;
            --glow: 0 0 15px rgba(188, 0, 0, 0.7);
            /* Font Arial cho tiếng Việt để hiển thị chính xác */
            --vn-font: Arial, "Helvetica Neue", Helvetica, sans-serif;
        }

        *{margin:0;padding:0;box-sizing:border-box;}
        html{scroll-behavior:smooth;}

        body {
            font-family: 'Rajdhani', sans-serif;
            background: #000;
            color: #e0e0e0;
            overflow-x: hidden;
            text-transform: uppercase;
        }

        /* Tự động đổi font khi sang tiếng Việt */
        html[lang="vi"] body {
            font-family: var(--vn-font);
        }

        /* Giữ font tiêu đề cố định */
        h1, .chalk-logo, .sub-logo, .inv-item, .lang-label, .btn-disabled {
            font-family: 'Orbitron', sans-serif !important;
        }

        /* HIỆU ỨNG CRT TOÀN MÀN HÌNH */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 11000;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }

        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: rgba(18, 16, 16, 0.03);
            opacity: 0;
            z-index: 11001;
            pointer-events: none;
            animation: flicker 0.12s infinite;
        }

        @keyframes flicker {
            0% { opacity: 0.27; } 5% { opacity: 0.35; } 10% { opacity: 0.24; }
            100% { opacity: 0.24; }
        }

        /* HÌNH NỀN */
        .static-bg {
            position: fixed;
            top: -5%; left: -5%;
            width: 110%; height: 110%;
            background: url('mikaindie.jpg') no-repeat center center;
            background-size: cover;
            z-index: -2;
            filter: brightness(0.7) contrast(1.1); 
            animation: breathing 20s ease-in-out infinite;
            transition: filter 0.5s ease;
        }

        @keyframes breathing {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .overlay {
            position: fixed; inset: 0;
            background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.4) 110%, rgba(0,0,0,0.9) 140%);
            z-index: -1;
        }

        /* MENU PHẢI */
        header { position: fixed; top: 50px; right: 40px; z-index: 2000; }
        .inventory-menu { display: flex; flex-direction: column; align-items: flex-end; gap: 20px; }
        .inv-item {
            color: #fff; text-decoration: none; font-size: 14px; font-weight: 700; 
            letter-spacing: 3px; transition: 0.4s; display: flex; align-items: center; gap: 12px;
        }
        .nav-dot {
            width: 8px; height: 8px; background-color: var(--primary-red);
            border-radius: 50%; box-shadow: var(--glow);
            animation: pulse-red 1.5s infinite ease-in-out;
        }
        @keyframes pulse-red {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.4; }
        }
        .inv-item:hover { color: var(--primary-red); transform: translateX(-10px); }

        /* LANGUAGE SWITCHER */
        .lang-container {
            margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; text-align: right;
        }
        .lang-label { font-size: 11px; color: #666; letter-spacing: 2px; margin-bottom: 5px; display: block; }
        .lang-btns { display: flex; gap: 8px; justify-content: flex-end; }
        .lang-btn { 
            background: none; border: none; color: #555; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.3s;
        }
        .lang-btn.active { color: var(--primary-red); text-shadow: var(--glow); }
        .lang-btn:hover { color: #fff; }

        /* HERO & LOGO */
        .hero-content { position: fixed; top: 50%; left: 8%; transform: translateY(-50%); z-index: 10; }
        .chalk-logo {
            font-family: 'Special Elite', cursive !important; font-size: clamp(60px, 10vw, 120px);
            color: #fff; line-height: 0.8; position: relative; animation: flicker-text 4s infinite;
            text-shadow: 2px 0 1px rgba(255,0,0,0.5), -2px 0 1px rgba(0,255,255,0.5);
        }
        
        @keyframes flicker-text { 0%, 18%, 20%, 50%, 100% { opacity: 1; } 19%, 22% { opacity: 0.6; } }

        /* NÚT DOWNLOAD */
        .btn-disabled {
            display: inline-block; margin-top: 15px; padding: 10px 25px;
            background: rgba(255, 255, 255, 0.05); color: rgba(255, 255, 255, 0.2);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            font-size: 13px; letter-spacing: 2px; text-decoration: none; cursor: not-allowed; transition: 0.3s;
        }

        /* ACTION STACK */
        .action-stack {
            position: fixed; bottom: 50px; right: 40px;
            display: flex; flex-direction: column; align-items: flex-end; gap: 20px; z-index: 2000;
        }
        .social-icons a { color: #fff; font-size: 20px; transition: 0.2s; margin-left: 15px;}
        .social-icons a:hover { color: var(--primary-red); text-shadow: var(--glow); }

        .support-me {
            background: #fff; color: #000; padding: 12px 30px; text-decoration: none;
            font-weight: 700; letter-spacing: 2px; border: 1px solid #fff; transition: 0.3s;
            animation: support-pulse 2s infinite; font-family: 'Orbitron';
        }
        @keyframes support-pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); transform: scale(1); }
            70% { box-shadow: 0 0 20px 10px rgba(255, 255, 255, 0); transform: scale(1.05); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); transform: scale(1); }
        }

        /* SECTIONS */
        section { 
            min-height: 100vh; display: flex; flex-direction: column; 
            justify-content: center; align-items: flex-start; padding: 100px 10%; position: relative; 
        }
        section:not(#top) { background: rgba(5, 5, 5, 0.95); z-index: 100; box-shadow: 0 -50px 100px #000; }
        h1 { font-size: 50px; margin-bottom: 30px; border-bottom: 2px solid var(--primary-red); padding-bottom: 10px; }

        .char-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; width: 100%; max-width: 1000px; }
        .char-card { height: 400px; border: 1px solid rgba(255,255,255,0.1); overflow: hidden; cursor: pointer; transition: 0.5s; position: relative; }
        .char-card img { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; transition: 0.5s; }
        .char-card:hover img { opacity: 1; transform: scale(1.05); }

        /* POPUP */
        .popup { position: fixed; inset: 0; background: rgba(0,0,0,0.98); display: none; z-index: 10000; padding: 50px; backdrop-filter: blur(10px); }
        .popup-box { display: flex; width: 100%; height: 100%; border: 1px solid var(--dark-red); background: #000; position: relative; }
        .popup-left { width: 45%; border-right: 1px solid var(--dark-red); }
        .popup-left img { width: 100%; height: 100%; object-fit: cover; }
        .popup-right { width: 55%; padding: 40px 60px; display: flex; flex-direction: column; overflow-y: auto; }
        .close-btn { position: absolute; top: 20px; right: 30px; font-size: 40px; color: var(--primary-red); cursor: pointer; }
        
        .stat-item { font-size: 11px; color: #555; letter-spacing: 1px; margin-bottom: 15px; }
        .stat-item span { display: block; color: #fff; font-size: 14px; font-weight: 700; margin-top: 4px; }
        .skill-tag { border: 1px solid var(--primary-red); color: var(--primary-red); padding: 4px 12px; font-size: 11px; margin-right: 5px; margin-bottom: 5px; display: inline-block;}
    </style>
</head>
<body>

<div class="static-bg" id="bgImg"></div>
<div class="overlay"></div>

<header>
    <nav class="inventory-menu">
        <a href="#top" class="inv-item" id="nav-top">TOP <span class="nav-dot"></span></a>
        <a href="#about" class="inv-item" id="nav-about">ABOUT <span class="nav-dot"></span></a>
        <a href="#story" class="inv-item" id="nav-story">STORY <span class="nav-dot"></span></a>
        <a href="#characters" class="inv-item" id="nav-chars">CHARACTERS <span class="nav-dot"></span></a>
        <a href="#trailers" class="inv-item" id="nav-trailers">TRAILERS <span class="nav-dot"></span></a>
        <a href="#contact" class="inv-item" id="nav-contact">CONTACT <span class="nav-dot"></span></a>

        <div class="lang-container">
            <span class="lang-label">LANGUAGE :</span>
            <div class="lang-btns">
                <button class="lang-btn active" id="btn-en" onclick="setLang('en')">EN</button>
                <span style="color: #222;">/</span>
                <button class="lang-btn" id="btn-vi" onclick="setLang('vi')">VN</button>
            </div>
        </div>
    </nav>
</header>

<div class="hero-content">
    <div class="chalk-logo">ASHEN TOWN</div><br>
    <div id="sub-logo" class="sub-logo" style="font-family:'Special Elite'; font-size: 30px; letter-spacing: 12px; border: 1px solid #444; padding: 5px 20px; background: rgba(0,0,0,0.6); display: inline-block;">PURGATORY</div>
    
    <div class="release-info" style="margin-top:20px;">
        <span id="txt-protocol" style="opacity: 0.5; font-size: 14px; letter-spacing: 2px;">PROTOCOL: EARLY_ACCESS</span><br>
        <span id="txt-deployment" style="color: var(--primary-red); font-size: 22px; text-shadow: 0 0 10px var(--primary-red);">DEPLOYMENT: ??/??/2030</span>
        <br>
        <a href="javascript:void(0)" class="btn-disabled"><i class="fa-solid fa-download"></i> <span id="txt-download">DOWNLOAD NOW</span></a>
    </div>
</div>

<div class="action-stack">
    <div class="social-icons">
        <span style="font-family: 'Special Elite'; font-size: 12px; color: #fff;">FOLLOW :</span>
        <a href="#"><i class="fa-brands fa-youtube"></i></a>
        <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
    </div>
    <a href="https://ko-fi.com/mikaindie1" target="_blank" class="support-me"><i class="fa-solid fa-heart"></i> SUPPORT ME</a>
</div>

<section id="top"></section>

<section id="about">
    <h1 id="h-about">ABOUT</h1>
    <div id="content-about" style="line-height: 1.6; font-size: 1.1rem;"></div>
</section>

<section id="story">
    <h1 id="h-story">STORY</h1>
    <div id="content-story" style="line-height: 1.8;"></div>
</section>

<section id="characters" style="align-items: center;">
    <h1 id="h-chars">CHARACTERS</h1>
    <div class="char-row" id="char-list"></div>
</section>

<div id="popup" class="popup">
    <div class="popup-box">
        <span class="close-btn" onclick="closePopup()">×</span>
        <div class="popup-left"><img id="p-img" src=""></div>
        <div class="popup-right">
            <h2 id="p-name" style="font-family: 'Orbitron'; font-size: 40px; color: #fff; margin-bottom: 20px;"></h2>
            <div id="p-desc" style="font-family: 'Special Elite'; font-size: 15px; color: #ccc; border: 1px solid #222; padding: 20px; background: rgba(255,255,255,0.02); min-height: 100px; margin-bottom: 20px;"></div>
            <div id="p-stats" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; border-top: 1px solid #222; padding-top: 20px;"></div>
        </div>
    </div>
</div>

<script>
    const langData = {
        en: {
            nav: { top: "TOP", about: "ABOUT", story: "STORY", chars: "CHARACTERS", trailers: "TRAILERS", contact: "CONTACT" },
            hero: { sub: "PURGATORY", protocol: "PROTOCOL: EARLY_ACCESS", deploy: "DEPLOYMENT: ??/??/2030", dl: "DOWNLOAD NOW" },
            about: `<p><strong>Enter Ashen Town: Purgatory</strong><br>Where ancient myths collide with visceral survival horror.</p><p>Play as <strong>Reika</strong>, a bio-terrorism operative thrust into a high-stakes investigation.</p>`,
            story: `A series of chilling disappearances has plagued the remote town of Kisaragi, Japan. As Reika, you must navigate a web of terrifying conspiracies to rescue a missing child and expose the darkness before it consumes the world.`,
            chars: [
                { img: 'Character_01.jpg', name: 'REIKA', desc: 'A high-ranking bio-terrorism operative specializing in field analysis and infiltration.', stats: 'Rank: Senior Agent | Blood: AB- | Height: 170cm' },
                { img: 'Character_02.jpg', name: 'UNKNOWN', desc: 'Personnel data encrypted. Classified as S-Rank threat.', stats: 'Rank: ??? | Blood: ??? | Height: ???' },
                { img: 'Character_03.jpg', name: 'INFECTED', desc: 'Biological specimen showing extreme mutations.', stats: 'Rank: N/A | Blood: Infected | Height: 190cm' }
            ]
        },
        vi: {
            nav: { top: "ĐẦU TRANG", about: "GIỚI THIỆU", story: "CỐT TRUYỆN", chars: "NHÂN VẬT", trailers: "TRAILERS", contact: "LIÊN HỆ" },
            hero: { sub: "LUÂN HỒI", protocol: "GIAO THỨC: TRUY CẬP SỚM", deploy: "TRIỂN KHAI: ??/??/2030", dl: "TẢI XUỐNG NGAY" },
            about: `<p><strong>Khám phá Ashen Town: Purgatory</strong><br>Nơi những huyền thoại cổ xưa đối đầu với nỗi kinh hoàng sinh tồn rợn tóc gáy.</p><p>Vào vai <strong>Reika</strong>, đặc vụ chống khủng bố sinh học đang dấn thân vào một cuộc điều tra đầy hiểm nguy.</p>`,
            story: `Hàng loạt vụ mất tích bí ẩn đang bao trùm thị trấn hẻo lánh Kisaragi, Nhật Bản. Trong vai Reika, bạn phải vượt qua những âm mưu kinh hoàng để giải cứu một đứa trẻ mất tích và phơi bày sự thật đen tối trước khi nó nuốt chửng thế giới.`,
            chars: [
                { img: 'Character_01.jpg', name: 'REIKA', desc: 'Đặc vụ cao cấp chuyên về phân tích hiện trường và xâm nhập nội bộ.', stats: 'Cấp bậc: Đặc vụ | Nhóm máu: AB- | Chiều cao: 170cm' },
                { img: 'Character_02.jpg', name: 'KHÔNG XÁC ĐỊNH', desc: 'Dữ liệu bị mã hóa. Được xếp hạng mối đe dọa cấp S.', stats: 'Cấp bậc: ??? | Nhóm máu: ??? | Chiều cao: ???' },
                { img: 'Character_03.jpg', name: 'VẬT CHỦ', desc: 'Mẫu vật sinh học cho thấy sự đột biến cực độ.', stats: 'Cấp bậc: N/A | Nhóm máu: Bị nhiễm | Chiều cao: 190cm' }
            ]
        }
    };

    function setLang(lang) {
        document.documentElement.lang = lang;
        const d = langData[lang];

        // Update Nav
        document.getElementById('nav-top').innerHTML = `${d.nav.top} <span class="nav-dot"></span>`;
        document.getElementById('nav-about').innerHTML = `${d.nav.about} <span class="nav-dot"></span>`;
        document.getElementById('nav-story').innerHTML = `${d.nav.story} <span class="nav-dot"></span>`;
        document.getElementById('nav-chars').innerHTML = `${d.nav.chars} <span class="nav-dot"></span>`;

        // Update Hero
        document.getElementById('sub-logo').innerText = d.hero.sub;
        document.getElementById('txt-protocol').innerText = d.hero.protocol;
        document.getElementById('txt-deployment').innerText = d.hero.deploy;
        document.getElementById('txt-download').innerText = d.hero.dl;

        // Update Content
        document.getElementById('h-about').innerText = d.nav.about;
        document.getElementById('content-about').innerHTML = d.about;
        document.getElementById('h-story').innerText = d.nav.story;
        document.getElementById('content-story').innerText = d.story;

        // Update Characters List
        const list = document.getElementById('char-list');
        list.innerHTML = '';
        d.chars.forEach((c, i) => {
            list.innerHTML += `<div class="char-card" onclick="openChar('${lang}', ${i})"><img src="${c.img}"></div>`;
        });

        // Toggle Active Class
        document.getElementById('btn-en').classList.toggle('active', lang === 'en');
        document.getElementById('btn-vi').classList.toggle('active', lang === 'vi');
    }

    let typeIndex = 0;
    let typeText = "";
    function typeWriter() {
        if (typeIndex < typeText.length) {
            document.getElementById("p-desc").innerHTML += typeText.charAt(typeIndex);
            typeIndex++;
            setTimeout(typeWriter, 15);
        }
    }

    function openChar(lang, index) {
        const char = langData[lang].chars[index];
        document.getElementById("popup").style.display = "block";
        document.getElementById("p-img").src = char.img;
        document.getElementById("p-name").innerText = char.name;
        document.getElementById("p-desc").innerText = "";
        typeText = char.desc;
        typeIndex = 0;
        typeWriter();

        const statsGrid = document.getElementById("p-stats");
        statsGrid.innerHTML = "";
        char.stats.split('|').forEach(s => {
            const [l, v] = s.split(':');
            statsGrid.innerHTML += `<div class="stat-item">${l.trim()}<span>${v.trim()}</span></div>`;
        });
    }

    function closePopup() { document.getElementById("popup").style.display = "none"; }
    
    // Background Effect
    window.addEventListener("scroll", () => {
        let scroll = window.pageYOffset;
        document.getElementById("bgImg").style.transform = `translateY(${scroll * 0.1}px)`;
    });

    // Khởi tạo mặc định
    window.onload = () => setLang('en');
</script>

</body>
</html>
