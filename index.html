<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASHEN TOWN | SURVIVAL HORROR</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        :root {
            --primary-red: #bc0000;
            --dark-red: #5e0000;
            --glow: 0 0 15px rgba(188, 0, 0, 0.7);
        }

        *{margin:0;padding:0;box-sizing:border-box;}
        html{scroll-behavior:smooth;}

        body {
            font-family: 'Rajdhani', sans-serif;
            background: #000;
            color: #e0e0e0;
            overflow-x: hidden;
            text-transform: uppercase;
        }

        /* Tối ưu hiển thị font */
        h1, .chalk-logo, .inv-item, .skill-tag, .stat-item { font-family: 'Orbitron', sans-serif !important; }
        
        /* Chỉnh riêng cho nội dung mô tả để dễ đọc tiếng Việt */
        #about-content, #story-content, #p-desc { 
            text-transform: none; 
            font-family: 'Rajdhani', sans-serif;
            font-size: 18px;
        }

        /* HIỆU ỨNG CRT */
        body::before {
            content: " "; display: block; position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 11000; background-size: 100% 3px, 3px 100%; pointer-events: none;
        }

        /* BACKGROUND */
        .static-bg {
            position: fixed; top: -5%; left: -5%; width: 110%; height: 110%;
            background: url('mikaindie.jpg') no-repeat center center;
            background-size: cover; z-index: -2; filter: brightness(0.6) contrast(1.1); 
            animation: breathing 20s ease-in-out infinite;
        }
        @keyframes breathing { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .overlay { position: fixed; inset: 0; background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.8) 120%); z-index: -1; }

        /* MENU */
        header { position: fixed; top: 50px; right: 40px; z-index: 2000; }
        .inventory-menu { display: flex; flex-direction: column; align-items: flex-end; gap: 15px; }
        .inv-item {
            color: #fff; text-decoration: none; font-size: 14px; font-weight: 700; 
            letter-spacing: 3px; transition: 0.4s; display: flex; align-items: center; gap: 15px;
        }
        .nav-dot { width: 8px; height: 8px; background-color: var(--primary-red); border-radius: 50%; box-shadow: var(--glow); }
        .inv-item:hover { color: var(--primary-red); transform: translateX(-10px); }

        .lang-switch { margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; }
        .lang-btn { background: none; border: none; color: #555; cursor: pointer; font-family: 'Orbitron'; font-size: 12px; transition: 0.3s; }
        .lang-btn.active { color: var(--primary-red); text-shadow: var(--glow); }

        /* HERO */
        .hero-content { position: fixed; top: 50%; left: 8%; transform: translateY(-50%); z-index: 10; }
        .chalk-logo {
            font-family: 'Special Elite', cursive !important; font-size: clamp(50px, 8vw, 100px);
            color: #fff; line-height: 0.8; position: relative;
            text-shadow: 2px 0 1px rgba(255,0,0,0.5);
        }

        /* SUPPORT BUTTON & SOCIAL */
        .action-stack { position: fixed; bottom: 50px; right: 40px; display: flex; flex-direction: column; align-items: flex-end; gap: 20px; z-index: 2000; }
        .support-me {
            background: #fff; color: #000; padding: 12px 30px; text-decoration: none;
            font-weight: 700; letter-spacing: 2px; border: 1px solid #fff; 
            transition: 0.3s; animation: support-pulse 2s infinite; display: inline-block;
        }
        .support-me i { color: var(--primary-red); margin-right: 8px; transition: 0.3s; }
        .support-me:hover { background: var(--primary-red); color: #fff; border-color: var(--primary-red); animation: none; transform: scale(1.1); }
        .support-me:hover i { color: #fff; }

        @keyframes support-pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); } 70% { box-shadow: 0 0 20px 10px rgba(255, 255, 255, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); } }

        /* SECTIONS */
        section { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: 100px 10%; position: relative; }
        section:not(#top) { background: rgba(5, 5, 5, 0.96); z-index: 100; }
        h1 { font-size: 40px; margin-bottom: 30px; border-left: 5px solid var(--primary-red); padding-left: 20px; }

        /* VIDEO CONTAINER - SỬA LỖI VIDEO NHỎ */
        .video-container { 
            width: 100%; 
            max-width: 900px; 
            aspect-ratio: 16 / 9; 
            border: 2px solid var(--dark-red); 
            background: #000;
            margin: 0 auto;
            position: relative;
        }
        .video-container iframe { width: 100%; height: 100%; border: none; }

        /* CHARACTERS */
        .char-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; width: 100%; }
        .char-card { height: 450px; border: 1px solid #222; overflow: hidden; cursor: pointer; transition: 0.4s; background: #111; }
        .char-card img { width: 100%; height: 100%; object-fit: cover; opacity: 0.5; transition: 0.5s; }
        .char-card:hover { border-color: var(--primary-red); }
        .char-card:hover img { opacity: 1; transform: scale(1.02); }

        /* POPUP */
        .popup { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; z-index: 10000; padding: 5%; }
        .popup-box { display: flex; width: 100%; height: 100%; border: 1px solid var(--dark-red); background: #050505; position: relative; }
        .popup-left { width: 40%; border-right: 1px solid #222; }
        .popup-left img { width: 100%; height: 100%; object-fit: cover; }
        .popup-right { width: 60%; padding: 40px; overflow-y: auto; }
        .close-btn { position: absolute; top: 20px; right: 30px; font-size: 30px; color: var(--primary-red); cursor: pointer; }
        
        .skill-tag { border: 1px solid var(--primary-red); color: var(--primary-red); padding: 5px 15px; font-size: 12px; margin: 5px; display: inline-block; }

        @media (max-width: 850px) {
            .popup-box { flex-direction: column; overflow-y: auto; }
            .popup-left, .popup-right { width: 100%; }
            .popup-left { height: 300px; }
            header { top: 20px; right: 20px; }
            .hero-content { left: 5%; }
        }
    </style>
</head>
<body>

<div class="static-bg" id="bgImg"></div>
<div class="overlay"></div>

<header>
    <nav class="inventory-menu">
        <a href="#top" class="inv-item" data-key="nav-top">TOP <span class="nav-dot"></span></a>
        <a href="#about" class="inv-item" data-key="nav-about">ABOUT <span class="nav-dot"></span></a>
        <a href="#story" class="inv-item" data-key="nav-story">STORY <span class="nav-dot"></span></a>
        <a href="#characters" class="inv-item" data-key="nav-chars">CHARACTERS <span class="nav-dot"></span></a>
        <a href="#trailers" class="inv-item" data-key="nav-trailers">TRAILERS <span class="nav-dot"></span></a>
        <a href="#contact" class="inv-item" data-key="nav-contact">CONTACT <span class="nav-dot"></span></a>
        
        <div class="lang-switch">
            <button class="lang-btn active" onclick="switchLang('en')">EN</button>
            <span style="color:#333">/</span>
            <button class="lang-btn" onclick="switchLang('vi')">VN</button>
        </div>
    </nav>
</header>

<div class="hero-content" id="top">
    <div class="chalk-logo">ASHEN TOWN</div>
    <div id="hero-sub" style="font-family:'Special Elite'; font-size: 24px; letter-spacing: 10px; color: var(--primary-red); margin: 10px 0;">PURGATORY</div>
    
    <div class="release-info" style="margin-top:20px;">
        <p id="txt-protocol" style="opacity: 0.5; font-size: 12px; letter-spacing: 2px;">PROTOCOL: EARLY_ACCESS</p>
        <p id="txt-deployment" style="color: #fff; font-size: 20px; letter-spacing: 1px;">DEPLOYMENT: ??/??/2030</p>
        <a href="#" class="support-me" style="margin-top:20px; animation: none; background: transparent; color: #fff; border: 1px dashed #444;">
            <i class="fa-solid fa-lock"></i> <span id="txt-dl">COMING SOON</span>
        </a>
    </div>
</div>

<div class="action-stack">
    <div class="social-icons">
        <a href="#"><i class="fa-brands fa-youtube"></i></a>
        <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
    </div>
    <a href="https://ko-fi.com/mikaindie1" target="_blank" class="support-me"><i class="fa-solid fa-heart"></i> SUPPORT ME</a>
</div>

<section id="about">
    <h1 data-key="nav-about">ABOUT</h1>
    <div id="about-content" style="max-width: 800px;"></div>
</section>

<section id="story">
    <h1 data-key="nav-story">STORY</h1>
    <div id="story-content" style="max-width: 800px;"></div>
</section>

<section id="characters" style="align-items: center;">
    <h1 data-key="nav-chars">CHARACTERS</h1>
    <div class="char-row" id="char-grid"></div>
</section>

<section id="trailers" style="align-items: center;">
    <h1 data-key="nav-trailers">TRAILERS</h1>
    <div class="video-container">
        <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
    </div>
</section>

<section id="contact" style="align-items: center;">
    <h1 data-key="nav-contact">CONTACT</h1>
    <p style="font-family: 'Special Elite'; font-size: 18px;">REPORT TO: <a href="mailto:mikaindie1@gmail.com" style="color: var(--primary-red); text-decoration: none;">mikaindie1@gmail.com</a></p>
</section>

<div id="popup" class="popup">
    <div class="popup-box">
        <span class="close-btn" onclick="closePopup()">×</span>
        <div class="popup-left"><img id="p-img" src=""></div>
        <div class="popup-right">
            <h2 id="p-name" style="font-family: 'Orbitron'; font-size: 35px; color: var(--primary-red);"></h2>
            <div style="margin: 20px 0; padding: 20px; background: rgba(255,255,255,0.03); border: 1px solid #222;">
                <p id="p-desc"></p>
            </div>
            <div id="p-stats" style="margin-bottom: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;"></div>
            <div id="p-skills"></div>
        </div>
    </div>
</div>

<script>
    const langData = {
        en: {
            nav: { "nav-top": "TOP", "nav-about": "ABOUT", "nav-story": "STORY", "nav-chars": "CHARACTERS", "nav-trailers": "TRAILERS", "nav-contact": "CONTACT" },
            hero: { sub: "PURGATORY", proto: "PROTOCOL: EARLY_ACCESS", deploy: "DEPLOYMENT: ??/??/2030", dl: "COMING SOON" },
            about: `<p><strong>Enter Ashen Town: Purgatory</strong> - Where ancient myths collide with visceral survival horror.</p><br><p>Play as <strong>Reika</strong>, a bio-terrorism operative thrust into a high-stakes investigation in a town that shouldn't exist.</p>`,
            story: `<p>A series of chilling disappearances has plagued the remote town of Kisaragi, Japan. A suffocating silence hangs over the authorities—no reports, no traces.</p><br><p>Driven by duty, Reika arrives to investigate. What she discovers is a terrifying conspiracy that threatens to consume the world.</p>`,
            chars: [
                { img: 'Character_01.jpg', name: 'REIKA', desc: 'A high-ranking bio-terrorism operative specializing in field analysis and infiltration.', stats: 'Rank: Senior Agent | Blood: AB- | Height: 170cm', skills: 'Pistol Mastery, Data Decryption' },
                { img: 'Character_02.jpg', name: 'UNKNOWN', desc: 'Data Corrupted.', stats: 'Rank: ??? | Blood: ???', skills: 'UNKNOWN' },
                { img: 'Character_03.jpg', name: 'UNKNOWN', desc: 'Data Corrupted.', stats: 'Rank: ??? | Blood: ???', skills: 'UNKNOWN' }
            ]
        },
        vi: {
            nav: { "nav-top": "ĐẦU TRANG", "nav-about": "GIỚI THIỆU", "nav-story": "CỐT TRUYỆN", "nav-chars": "NHÂN VẬT", "nav-trailers": "TRAILERS", "nav-contact": "LIÊN HỆ" },
            hero: { sub: "LUYỆN NGỤC", proto: "GIAO THỨC: TRUY CẬP SỚM", deploy: "TRIỂN KHAI: ??/??/2030", dl: "SẮP RA MẮT" },
            about: `<p><strong>Bước vào Ashen Town: Luyện Ngục</strong> - Nơi những huyền thoại cổ xưa đối đầu với nỗi kinh hoàng sinh tồn rợn tóc gáy.</p><br><p>Vào vai <strong>Reika</strong>, đặc vụ chống khủng bố sinh học dấn thân vào một cuộc điều tra đầy hiểm nguy tại một thị trấn lẽ ra không nên tồn tại.</p>`,
            story: `<p>Hàng loạt vụ mất tích bí ẩn bao trùm thị trấn hẻo lánh Kisaragi, Nhật Bản. Một sự im lặng đến nghẹt thở bao trùm lên chính quyền—không báo cáo, không dấu vết.</p><br><p>Được thúc đẩy bởi nhiệm vụ, Reika đến để điều tra và phát hiện ra một âm mưu kinh hoàng đe dọa nuốt chửng thế giới.</p>`,
            chars: [
                { img: 'Character_01.jpg', name: 'REIKA', desc: 'Đặc vụ chống khủng bố sinh học cấp cao, chuyên gia phân tích hiện trường và xâm nhập.', stats: 'Cấp bậc: Đặc vụ | Nhóm máu: AB- | Chiều cao: 170cm', skills: 'Bậc thầy súng ngắn, Giải mã dữ liệu' },
                { img: 'Character_02.jpg', name: 'KHÔNG XÁC ĐỊNH', desc: 'Dữ liệu bị lỗi.', stats: 'Cấp bậc: ??? | Nhóm máu: ???', skills: '???' },
                { img: 'Character_03.jpg', name: 'KHÔNG XÁC ĐỊNH', desc: 'Dữ liệu bị lỗi.', stats: 'Cấp bậc: ??? | Nhóm máu: ???', skills: '???' }
            ]
        }
    };

    let currentLang = 'en';

    function switchLang(lang) {
        currentLang = lang;
        document.documentElement.lang = lang;
        const data = langData[lang];

        // Update Nav & Headers
        Object.keys(data.nav).forEach(key => {
            const el = document.querySelector(`[data-key="${key}"]`);
            if(el) {
                if(el.tagName === 'A') el.innerHTML = `${data.nav[key]} <span class="nav-dot"></span>`;
                else el.innerText = data.nav[key];
            }
        });

        // Update Hero
        document.getElementById('hero-sub').innerText = data.hero.sub;
        document.getElementById('txt-protocol').innerText = data.hero.proto;
        document.getElementById('txt-deployment').innerText = data.hero.deploy;
        document.getElementById('txt-dl').innerText = data.hero.dl;

        // Update Content
        document.getElementById('about-content').innerHTML = data.about;
        document.getElementById('story-content').innerHTML = data.story;

        // Update Characters Grid
        const grid = document.getElementById('char-grid');
        grid.innerHTML = '';
        data.chars.forEach((c, i) => {
            grid.innerHTML += `<div class="char-card" onclick="openCharacter(${i})"><img src="${c.img}"></div>`;
        });

        // Update Buttons State
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.remove('active');
            if(btn.innerText.toLowerCase() === (lang === 'vi' ? 'vn' : 'en')) btn.classList.add('active');
        });
    }

    function openCharacter(index) {
        const char = langData[currentLang].chars[index];
        document.getElementById("popup").style.display = "block";
        document.getElementById("p-img").src = char.img;
        document.getElementById("p-name").innerText = char.name;
        document.getElementById("p-desc").innerText = char.desc;

        const statsGrid = document.getElementById("p-stats");
        statsGrid.innerHTML = "";
        char.stats.split('|').forEach(s => {
            statsGrid.innerHTML += `<div style="font-size:12px; color:#666;">${s.trim()}</div>`;
        });

        const skillsDiv = document.getElementById("p-skills");
        skillsDiv.innerHTML = "";
        char.skills.split(',').forEach(s => {
            skillsDiv.innerHTML += `<span class="skill-tag">${s.trim()}</span>`;
        });
    }

    function closePopup() { document.getElementById("popup").style.display = "none"; }

    window.onload = () => switchLang('en');
    window.addEventListener("scroll", () => {
        const scrolled = window.pageYOffset;
        document.getElementById("bgImg").style.transform = `scale(${1 + scrolled * 0.0001}) translateY(${scrolled * 0.1}px)`;
    });
</script>

</body>
</html>
